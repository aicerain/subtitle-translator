name: Build Installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:        # 手动触发

jobs:
  # ============================================================
  # macOS — 出 .dmg
  # ============================================================
  build-macos:
    name: Build macOS .dmg
    runs-on: macos-14        # Apple Silicon runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read VERSION
        id: ver
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Pillow (for icon generation)
        run: pip install Pillow

      - name: Generate app icon
        run: python assets/generate_icon.py

      - name: Install ffmpeg (for app testing only — final users still need their own)
        run: |
          brew install ffmpeg create-dmg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Make .icns
        run: |
          chmod +x assets/make_icns.sh
          ./assets/make_icns.sh

      - name: Build .app via PyInstaller
        run: |
          pyinstaller SubtitleTranslator.spec --clean --noconfirm

      - name: Package .dmg
        run: |
          chmod +x create_dmg.sh
          ./create_dmg.sh

      - name: Rename DMG with version
        run: |
          mv dist/SubtitleTranslator.dmg "dist/SubtitleTranslator-${{ steps.ver.outputs.version }}-macOS.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubtitleTranslator-${{ steps.ver.outputs.version }}-macOS
          path: dist/SubtitleTranslator-${{ steps.ver.outputs.version }}-macOS.dmg
          retention-days: 30

      - name: Attach to Release (if tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SubtitleTranslator-${{ steps.ver.outputs.version }}-macOS.dmg
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # Windows — 出 .zip 便携包
  # ============================================================
  build-windows:
    name: Build Windows .zip
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read VERSION
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content VERSION).Trim()
          "version=$v" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Pillow & generate icon
        run: |
          pip install Pillow
          python assets/generate_icon.py

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build .exe via PyInstaller
        run: |
          pyinstaller SubtitleTranslator.spec --clean --noconfirm

      - name: Package .zip
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          Compress-Archive -Path dist/SubtitleTranslator -DestinationPath "dist/SubtitleTranslator-$ver-Windows-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubtitleTranslator-${{ steps.ver.outputs.version }}-Windows
          path: dist/SubtitleTranslator-${{ steps.ver.outputs.version }}-Windows-x64.zip
          retention-days: 30

      - name: Attach to Release (if tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SubtitleTranslator-${{ steps.ver.outputs.version }}-Windows-x64.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
