name: Build Installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# 关键:让 softprops/action-gh-release 能创建 Release
permissions:
  contents: write

jobs:
  # ============================================================
  # macOS — 出 .dmg
  # ============================================================
  build-macos:
    name: Build macOS .dmg
    runs-on: macos-14        # Apple Silicon runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read VERSION
        id: ver
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Pillow (for icon generation)
        run: pip install --prefer-binary Pillow

      - name: Generate app icon
        run: python assets/generate_icon.py

      - name: Install ffmpeg + create-dmg (build dependencies)
        run: |
          brew install ffmpeg create-dmg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install --prefer-binary -r requirements.txt
          pip install --prefer-binary pyinstaller

      - name: Make .icns
        run: |
          chmod +x assets/make_icns.sh
          ./assets/make_icns.sh

      - name: Build .app via PyInstaller
        run: |
          pyinstaller SubtitleTranslator.spec --clean --noconfirm

      - name: Package .dmg
        run: |
          chmod +x create_dmg.sh
          ./create_dmg.sh

      - name: Rename DMG with version
        run: |
          mv dist/SubtitleTranslator.dmg "dist/SubtitleTranslator-${{ steps.ver.outputs.version }}-macOS.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubtitleTranslator-${{ steps.ver.outputs.version }}-macOS
          path: dist/SubtitleTranslator-${{ steps.ver.outputs.version }}-macOS.dmg
          retention-days: 30

      - name: Attach to Release (if tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SubtitleTranslator-${{ steps.ver.outputs.version }}-macOS.dmg
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # Windows — 出 .zip 便携包
  # ============================================================
  build-windows:
    name: Build Windows .zip
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read VERSION
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content VERSION).Trim()
          "version=$v" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Pillow & generate icon
        run: |
          pip install --prefer-binary Pillow
          python assets/generate_icon.py

      - name: Install Python dependencies (prefer binary wheels)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel
          # 拆开装 + 详细日志,定位失败
          # 先装核心(PyQt6 + 翻译 SDK)
          pip install --prefer-binary PyQt6 openai anthropic requests pysrt ffmpeg-python -v
          # Whisper 系列体积大,单独装
          pip install --prefer-binary faster-whisper -v
          pip install --prefer-binary pyinstaller -v
        continue-on-error: false

      - name: Show installed packages (debug)
        run: pip list

      - name: Build .exe via PyInstaller
        run: |
          pyinstaller SubtitleTranslator.spec --clean --noconfirm

      - name: Package .zip
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          Compress-Archive -Path dist/SubtitleTranslator -DestinationPath "dist/SubtitleTranslator-$ver-Windows-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubtitleTranslator-${{ steps.ver.outputs.version }}-Windows
          path: dist/SubtitleTranslator-${{ steps.ver.outputs.version }}-Windows-x64.zip
          retention-days: 30

      - name: Attach to Release (if tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SubtitleTranslator-${{ steps.ver.outputs.version }}-Windows-x64.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
